<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sueter Olivia | Catálogo ANNID</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header>
        <div class="logo">ANNID</div>
        <nav>
            <a href="../index.html">Inicio</a> 
            <a href="catalogo.html">Catálogo</a>
        </nav>
    </header>
 <section class="detalles-seccion">
        <div class="detalles-contenedor">
            <div class="detalle-imagen">
                <img src="https://i.postimg.cc/hv4nCNDN/sueter-oliva.jpg" alt="Detalle de prenda">
            </div>
            <div class="detalle-info">
                <span class="categoria">Exclusivo de ANNID</span>
                <h2>Sueter Olivia</h2>
                <p class="precio-grande">s/ 60.00</p>
                
                
                <div class="opciones">
    <span class="titulo-opcion">Colores disponibles:</span>
    <div class="colores-box">
        <button class="color-btn" onclick="seleccionarColor(this, 'Chocolate')">Chocolate</button>
    </div> 
</div>

<div class="opciones">
    <span class="titulo-opcion">Tallas disponibles:</span>
    <div class="tallas-box">
        <button class="talla-btn" onclick="seleccionarTalla(this, 'S')">S</button>
        <button class="talla-btn" onclick="seleccionarTalla(this, 'M')">M</button>
    </div>
</div>

<div class="opciones">
    <span class="titulo-opcion">Cantidad:</span>
    <select id="cantidad-select" class="cantidad-dropdown" onchange="actualizarCantidad()">
        <option value="1">1</option>
        <option value="2">2</option>
    </select>
</div>

<a id="btn-whatsapp" href="https://wa.me/51918573908?text=¡Hola%20ANNID!%20Quiero%20comprar%20la%20*Sueter%20Olivia*%20(s/ 60.00)." target="_blank" class="btn-comprar-final-link">Comprar ahora</a>
</div>
    </section>

<footer>
    <div class="footer-contenido">
        <p>&copy; 2026 ANNID. Diseñado con amor para amantes de la moda.</p>
        
        <div class="footer-redes">
            <a href="https://www.instagram.com/annid.22?igsh=eHJwODI1Nnl2dm5w" target="_blank" class="instagram-link">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ56S3XVx_siGrbcwh6R-yzBMZBgwwRrzRTQQ&s" alt="Instagram" class="insta-logo-img">
                @annid.collection
            </a>
        </div>
    </div>
</footer>

</body>
<script>
    // Variables para guardar lo que elija el usuario
    let colorSeleccionado = "";
    let tallaSeleccionada = "";
    let cantidadSeleccionada = "1"; // Por defecto siempre será 1
    
    // Tu número de WhatsApp 
    const numeroTelefono = "51918573908"; 
    const nombreProducto = "Sueter Olivia";
    const precioProducto = "s/ 60.00";

    function seleccionarColor(elemento, color) {
        document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('activo'));
        elemento.classList.add('activo');
        colorSeleccionado = color;
        actualizarEnlace();
    }

    function seleccionarTalla(elemento, talla) {
        document.querySelectorAll('.talla-btn').forEach(btn => btn.classList.remove('activo'));
        elemento.classList.add('activo');
        tallaSeleccionada = talla;
        actualizarEnlace();
    }

    // Nueva función para detectar el cambio de cantidad
    function actualizarCantidad() {
        const selectCantidad = document.getElementById('cantidad-select');
        cantidadSeleccionada = selectCantidad.value;
        actualizarEnlace();
    }

    function actualizarEnlace() {
        const botonWA = document.getElementById('btn-whatsapp');
        
        // Estructuramos el mensaje final incluyendo la cantidad de prendas
        let mensaje = `¡Hola ANNID! Quiero comprar ${cantidadSeleccionada} unidad(es) de la *${nombreProducto}* (${precioProducto}).`;
        
        if(colorSeleccionado) mensaje += ` Color: ${colorSeleccionado}.`;
        if(tallaSeleccionada) mensaje += ` Talla: ${tallaSeleccionada}.`;
        
        botonWA.href = `https://wa.me/${numeroTelefono}?text=${encodeURIComponent(mensaje)}`;
    }
</script>
</html>
